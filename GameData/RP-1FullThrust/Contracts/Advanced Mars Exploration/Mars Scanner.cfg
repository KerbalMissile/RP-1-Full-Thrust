CONTRACT_TYPE
{
    name = MarsScannerFT
    title = Martian Atmospheric Scanner
    group = AdvancedMarsExplorationUM
    agent = Surveys

    description = <b>Program: Advanced Mars Exploration<br>Type: <color=green>Required</color></b><br><br>Design and successfully launch an uncrewed atmospheric scanner that will collect and transmit atmospheric data from Mars.

    synopsis = Send an uncrewed atmospheric scanner to Mars

    completedMessage = Congratulations! Successfully deploying an atmospheric scanner on Mars is a significant achievement. The data collected will greatly enhance our understanding of the Martian atmosphere.

    sortKey = 1402

    cancellable = true
    declinable = true
    autoAccept = false
    minExpiry = 0
    maxExpiry = 0
    maxCompletions = 0
    maxSimultaneous = 1
    deadline = 0

    targetBody = Mars

    // ************ REWARDS ************
    
    prestige = Trivial       // 1.0x
    advanceFunds = 0
    rewardScience = 0
    rewardFunds = 0
    failureFunds = 0
    rewardReputation = 100
    failureReputation = 0

    // ************ DATA ************

    DATA
	{
		type = double
		orbitKM = 140
		title = Get Maximum Orbit Height
	}

    // ************ REQUIREMENTS ************
    REQUIREMENT
    {
        name = ProgramActive
        type = ProgramActive
        program = AdvancedMarsExploration
    }

    // ************ PARAMETERS ************

    PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = Orbit Mars
		define = OrbitMars

		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}
		PARAMETER
		{
			name = EnterOrbit
			type = Orbit
			situation = ORBITING
			maxApA = @/orbitKM * 1000
			disableOnStateChange = true
			title = Orbit Mars with a maximum apoareion (apoapsis) of @/orbitKM km
			
			PARAMETER
			{
				name = Duration
				type = Duration

				duration = 2m

				preWaitText = Check for stable orbit
				waitingText = Checking for stable orbit
				completionText = Stable orbit: Confirmed
			}
		}
	}
}