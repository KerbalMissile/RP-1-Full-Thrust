CONTRACT_TYPE
{
	name = EarlySpaceplanesSuborbitalFlight
	title = Reach Orbital Speed & Return Safely to Earth (Spaceplanes)
	group = EarlySpaceplanes

	description = <b>Program: Crewed Orbit or Early Earth Observation Satellites<br>Type: <color=green>Required</color></b><br><br>Reentry is brutally hot and dangerous, but it can be survivable with the right technology and equipment. We want you to design, build, and launch a spaceplane that can survive a reentry and make a soft landing or splashdown on Earth. Note that orbital-speed suborbital flights are acceptable as well. Historically this research started with weapon reentry vehicles for the newly developing ICBM forces but the research, and rockets, were quite applicable elsewhere; reconnaissance satellite recovery vessels, crewed capsules, and interplanetary landers have also withstood this crucible.
	genericDescription = Recover a space plane from an orbital-velocity descent. Your vessel must reach a surface velocity of at least 6550 m/s at a minimum altitude of 155km. 

	synopsis = Recover a craft from an orbital-velocity descent

	completedMessage = Congratulations! The space plane has survived reentry, and engineers are examining it very keenly indeed.

	sortKey = 616

	cancellable = false
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = HomeWorld()

	// ************ REWARDS ************
	prestige = Trivial       // 1.0x
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 150
	failureReputation = 0 // was @rewardReputation

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = Any
		type = Any

		REQUIREMENT
		{
			name = ProgramActive
			type = ProgramActive
			program = EarlyOrbitalSpaceplanes
		}
	}

	PARAMETER
	{
		name = OrbitReturn
		type = VesselParameterGroup
		title = Recover a craft from orbit

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}
		PARAMETER
		{
			name = HasNoCrew
			type = HasCrew
			maxCrew = 0
			minCrew = 0
			title = Uncrewed
			hideChildren = true
		}
		PARAMETER
		{
			name = OrbitalVelocity
			type = ReachState
			minSpeed = 6550
			speedMode = Surface
			minAltitude = 155000
			situation = SUB_ORBITAL
			title = Reach surface velocity of 6550 m/s with a minimum altitude of 155 km
			disableOnStateChange = true
		}
		PARAMETER
		{
			name = ReturnHome
			type = RP1ReturnHome
			title = Return home safely
			hideChildren = true
			completeInSequence = true
		}
	}

	PARAMETER
	{
		name = ReturnVesselGroup
		type = VesselParameterGroup
		title = Land anywhere with a descent angle lower than 10 degrees, and a suface velocity below 100 m/s.
		vessel = supersonicCraft
		hideChildren = true

		PARAMETER
		{
			name = ReturnHome
			type = RP1ReturnHome
			title = Return home safely
			maxSpeed = 5
			hideChildren = true
			completeInSequence = true
		}
		PARAMETER
		{
			name = HorizontalLanding
			type = HorizontalLanding
			descentAngle = 10
			maxSrfVel = 100
			hideChildren = true
			completeInSequence = true
		}
	}
}