CONTRACT_TYPE
{
	name = EarlySpaceplanesOrbital
	group = EarlySpaceplanes

	title = Early Spaceplanes Uncrewed Orbital Test Flight

	description = <b>Program: EarlySpaceplanes<br>Type: <color=green>Required</color></b><br><br>Design, build, and launch an uncrewed plane and put it into an orbit and return home safely. Optionally, landing back at the runway will award extra reputation. If playing from the Cape, the Space Shuttle runway provided by the RSS-CanaveralHD mod is also a valid landing target.
	genericDescription = Design, build and launch a crewed rocket or plane to put a person into high atmosphere above a specific altitude and return home safely.

	synopsis = Launch an uncrewed spaceplane to orbit.

	completedMessage = Congratulations on a successful flight!
	
	sortKey = 615

	deadline = 0
	cancellable = false
	declinable = false
	autoAccept = false
	minExpiry = 1
	maxExpiry = 1

	targetBody = HomeWorld()

	maxCompletions = 1
	maxSimultaneous = 1
	prestige = Trivial

	// ************ REWARDS ************
	prestige = Trivial       // 1.0x
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 100000
	failureFunds = 100000
	rewardReputation = 90
	failureReputation = 90 // was @rewardReputation
	
	// ************* REQUIREMENTS ****************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = EarlyOrbitalSpaceplanes
	}

	PARAMETER
	{
		name = EarlyUncrewedSpaceplaneOrbit
		type = VesselParameterGroup
		title = Early Uncrewed Spaceplane Orbit
		define = EarlySpaceplaneOrbitUncrewed
		
		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}
		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}
		PARAMETER
		{
			name = Orbit
			type = Orbit
			minPeA = 145000
			disableOnStateChange = true
			title = Achieve orbit around @targetBody with a minimum perigee of 145 km
			
			PARAMETER
			{
				name = Duration
				type = Duration

				duration = 25m

				preWaitText = Check for stable orbit
				waitingText = Checking for stable orbit
				completionText = Stable orbit: Confirmed
			}
		}
	}

	PARAMETER
	{
		name = ReturnVesselGroup
		type = VesselParameterGroup
		title = Land anywhere with a descent angle lower than 10 degrees, and a suface velocity below 100 m/s.
		vessel = supersonicCraft
		hideChildren = true

		PARAMETER
		{
			name = ReturnHome
			type = RP1ReturnHome
			title = Return home safely
			maxSpeed = 5
			hideChildren = true
			completeInSequence = true
		}
		PARAMETER
		{
			name = HorizontalLanding
			type = HorizontalLanding
			descentAngle = 10
			maxSrfVel = 100
			hideChildren = true
			completeInSequence = true
		}
	}
}
