CONTRACT_TYPE
{
	name = FirstHeavySpaceplaneLaunch
	group = LateEarthSpacePlanes

	title = Heavy Spaceplane Test (Crewed)

	description = <b>Program: Late Earth Orbital Spaceplanes<br>Type: <color=green>Required</color></b><br><br>Design, build, and launch a larger crewed space plane and put it into an orbit with a minimum PE of 200km and stay there for a day with a minimum of 2 crew, and return home safely. You will need to land back at the runway for the contract to be completed. If playing from the Cape, the Space Shuttle runway provided by the RSS-CanaveralHD mod is also a valid landing target.
	genericDescription = Design, build and launch a crewed plane to put 2 people into an orbit above 200km and return home safely.

	synopsis = Launch a crew of 2 or more into a 200km orbit for a day, and land back at the runway. 

	completedMessage = Congratulations on a successful first flight!
	
	sortKey = 616

	deadline = 0
	cancellable = false
	declinable = false
	autoAccept = false
	minExpiry = 1
	maxExpiry = 1

	targetBody = HomeWorld()

	maxCompletions = 1
	maxSimultaneous = 1
	prestige = Trivial

	// ************ REWARDS ************
	prestige = Trivial       // 1.0x
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 750
	failureReputation = 900 // was @rewardReputation
	
	// ************* REQUIREMENTS ****************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = LateEarthSpacePlanes
	}

	PARAMETER
	{
		name = LateCrewedSpaceplaneOrbit
		type = VesselParameterGroup
		title = Late Crewed Spaceplane Day Long Orbit
		define = LateSpaceplaneOrbitCrewed
		
		PARAMETER
		{
			name = SpaceplaneMass
			type = VesselMass
			minMass = 40
			title = Spaceplane Must Be 40 Tons
			disableOnStateChange = false
		}
		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}
		PARAMETER
		{
			name = TwoCrew
			type = HasCrew
			minCrew = 2
			title = Have 2 Crew Members on board
			hideChildren = true
			disableOnStateChange = true    // Probably to prevent the timers from getting reset when EVAing a naut
		}
		PARAMETER
		{
			name = Orbit
			type = Orbit
			minPeA = 200000
			maxApA = 600000   // Inner van allen belt
			disableOnStateChange = true
			title = Achieve orbit around @targetBody with a minimum perigee of 200 km
			
			PARAMETER
			{
				name = Duration
				type = Duration

				duration = 1d

				preWaitText = Check for stable orbit
				waitingText = Checking for stable orbit
				completionText = Stable orbit: Confirmed
			}
		}
	}

	PARAMETER
	{
		name = ReturnVesselGroup
		type = VesselParameterGroup
		title = Land back at the runway with a descent angle lower than 10 degrees, and a suface velocity below 120 m/s.
		vessel = crewedOrbitalCraft
		hideChildren = true

		PARAMETER
		{
			name = ReturnHome
			type = RP1ReturnHome
            title = Return Home Safely
			landAtFacility = Runway
			maxSpeed = 5
			hideChildren = true
			completeInSequence = true
		}
		PARAMETER
		{
			name = HorizontalLanding
			type = HorizontalLanding
			descentAngle = 10
			maxSrfVel = 120
			hideChildren = true
			completeInSequence = true
		}
	}
}
