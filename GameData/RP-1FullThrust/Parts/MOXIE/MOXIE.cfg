//**********************************************************************************

// M.O.X.I.E.

// Based on the MOXIE (Mars Oxygen In-Situ Resource Utilization Experiment) instrument flown on the Mars 2020 Perseverance rover.

// https://www.nasa.gov/missions/mars-2020-perseverance/perseverance-rover/nasas-oxygen-generating-experiment-moxie-completes-mars-mission/

//**********************************************************************************

+PART[sensorAtmosphere]:BEFORE[RP0]
{
    %name = moxie
    %RSSROConfig = true
    %RP0conf = true
    %rescaleFactor = 1.0
    %title = M.O.X.I.E.
    %description = The Mars Oxygen In-Situ Resource Utilization Experiment (MOXIE) is a technology demonstration that produces oxygen from the carbon dioxide in the Martian atmosphere. MOXIE works by taking in Martian air, filtering out dust particles, and then using solid oxide electrolysis to split the carbon dioxide molecules into oxygen and carbon monoxide. This technology could pave the way for future human missions to Mars by providing a sustainable source of oxygen for breathing and rocket propellant.
    %manufacturer = JPL
    %mass = 0.025
    %maxTemp = 873.15
    %PhysicsSignificance = 1
    %tags = science moxie mars oxygen in-situ resource utilization experiment jpl perseverance rover
    %TechRequired = advancedUncrewedLanding // It's placed in this node instead of the proper one due to the Advanced Mars Uncrewed program being accepted much earlier than the interplanetary rover tech nodes.
    %cost = 5000
    %entryCost = 20000

    !MODULE[ModuleScienceExperiment] {}  
}