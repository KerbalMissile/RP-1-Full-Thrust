@PART[*]:HAS[#engineType[RD105EngineType]]:NEEDS[RealismOverhaulEngines]
{
	%title = RD-105
	%manufacturer = OKb 456 (Glushko)
	%description = Originally meant to be used on the R-7 Semyorka rocket With the RD-106 before its replacement by the RD-108 and RD-107.

	@tags ^= :$: rd-105 rd105 rd 105 R-7 R7 R6 R-6

	%specLevel = operational

	@MODULE[ModuleEngines*]
	{
		%EngineType = LiquidFuel
	}

	!MODULE[ModuleEngineConfigs],*{}
	!MODULE[ModuleAlternator],*{}
	!RESOURCE,*{}

	@MODULE[ModuleGimbal]
	{
		%gimbalRange = 0
		%useGimbalResponseSpeed = true
		%gimbalResponseSpeed = 1
	}

	MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEngines
		configuration = RD-105configuration
		modded = false
		origMass = 0.782
		literalZeroIgnitions = true

		CONFIG
		{
			name = RD-105-1
			description = The first RD-105 config, RD-105-1, it is the base config for the RD-105, basically the same as the RD-106. 
			specLevel = prototype
			minThrust = 627.6
			maxThrust = 627.6
			heatProduction = 35
			PROPELLANT
			{
				name = Kerosene
				ratio = 0.22
				DrawGauge = True
			}

			PROPELLANT
			{
				name = LqdOxygen
				ratio = 0.78
				DrawGauge = False
			}
			%ullage = True
			%pressureFed = False
			%ignitions = 0
			IGNITOR_RESOURCE
			{
				name = ElectricCharge
				amount = 0.5
			}
			IGNITOR_RESOURCE
			{
				name = TEATEB
				amount = 1
			}

			atmosphereCurve
			{
				key = 0 302
				key = 1 260
			}
			
			massMult = 1.0

			TESTFLIGHT:NEEDS[TestLite|TestFlight]
			{
				testedBurnTime = 140
				ratedBurnTime = 130
				safeOverburn = false
				ignitionReliabilityStart = 0.814444
				ignitionReliabilityEnd = 0.993333
				ignitionDynPresFailMultiplier = 0.1
				cycleReliabilityStart = 0.809608
				cycleReliabilityEnd = 0.999412
				techTransfer = RD-106-1
			}

		}

		CONFIG
		{
			name = RD-105-2
			description = The second config for the RD-105, the RD-105-2, it is an upgrade variant of the -1 variant, if the RD-105 ever flew upgrades would probably have happened.
			specLevel = AltHist
			minThrust = 631.2
			maxThrust = 631.2
			heatProduction = 35
			PROPELLANT
			{
				name = Kerosene
				ratio = 0.23
				DrawGauge = True
			}

			PROPELLANT
			{
				name = LqdOxygen
				ratio = 0.77
				DrawGauge = False
			}
			%ullage = True
			%pressureFed = False
			%ignitions = 0
			IGNITOR_RESOURCE
			{
				name = ElectricCharge
				amount = 0.5
			}
			IGNITOR_RESOURCE
			{
				name = TEATEB
				amount = 1
			}

			atmosphereCurve
			{
				key = 0 302
				key = 1 260
			}
			
			massMult = 1.0

			TESTFLIGHT:NEEDS[TestLite|TestFlight]
			{
				testedBurnTime = 160
				ratedBurnTime = 140
				safeOverburn = false
				ignitionReliabilityStart = 0.824444
				ignitionReliabilityEnd = 0.994333
				ignitionDynPresFailMultiplier = 0.1
				cycleReliabilityStart = 0.839608
				cycleReliabilityEnd = 0.999512
				techTransfer = RD-106-2
			}

		}
	}
	
	RESOURCE
	{
		name = TEATEB
		amount = 1
		maxAmount = 1
	}
}
