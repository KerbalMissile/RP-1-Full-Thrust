@PART[*]:HAS[#engineType[RD106EngineType]]:NEEDS[RealismOverhaulEngines]
{
	%title = RD-106
	%manufacturer = OKb 456 (Glushko)
	%description = Originally meant to be used on the R-7 Semyorka rocket with the RD-105 before its replacement by the RD-108 and RD-107.
	@tags ^= :$: rd-106 rd106 rd 106 R-7 R7 R-6 R6

	%specLevel = operational

	@MODULE[ModuleEngines*]
	{
		%EngineType = LiquidFuel
	}

	!MODULE[ModuleEngineConfigs],*{}
	!MODULE[ModuleAlternator],*{}
	!RESOURCE,*{}

	@MODULE[ModuleGimbal]
	{
		%gimbalRange = 0
		%useGimbalResponseSpeed = true
		%gimbalResponseSpeed = 1
	}

	MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEngines
		configuration = RD-106configuration
		modded = false
		origMass = 0.802
		literalZeroIgnitions = true

		CONFIG
		{
			name = RD-106-1
			description = The first RD-106 engine configuration, due to the RD-106, and also the RD-105, not have flown and were barely tested, the names are purely speculative.
			specLevel = prototype
			minThrust = 645.3
			maxThrust = 645.3
			heatProduction = 35
			PROPELLANT
			{
				name = Kerosene
				ratio = 0.22
				DrawGauge = True
			}

			PROPELLANT
			{
				name = LqdOxygen
				ratio = 0.78
				DrawGauge = False
			}
			%ullage = True
			%pressureFed = False
			%ignitions = 0
			IGNITOR_RESOURCE
			{
				name = ElectricCharge
				amount = 0.5
			}
			atmosphereCurve
			{
				key = 0 310
				key = 1 250
			}
			massMult = 1.0

			TESTFLIGHT:NEEDS[TestLite|TestFlight]
			{
				testedBurnTime = 350
				ratedBurnTime = 330
				safeOverburn = false
				ignitionReliabilityStart = 0.814444
				ignitionReliabilityEnd = 0.993333
				ignitionDynPresFailMultiplier = 0.1
				cycleReliabilityStart = 0.809608
				cycleReliabilityEnd = 0.999412
				techTransfer = RD-105-1
			}

		}

		CONFIG
		{
			name = RD-106-2
			description = The second RD-106 configuration, the RD-106-2, it is a speculatibe upgrade to the RD-106.
			specLevel = altHist
			minThrust = 651.3
			maxThrust = 651.3
			heatProduction = 35
			PROPELLANT
			{
				name = Kerosene
				ratio = 0.23
				DrawGauge = True
			}

			PROPELLANT
			{
				name = LqdOxygen
				ratio = 0.77
				DrawGauge = False
			}
			%ullage = True
			%pressureFed = False
			%ignitions = 0
			IGNITOR_RESOURCE
			{
				name = ElectricCharge
				amount = 0.5
			}
			IGNITOR_RESOURCE
			{
				name = TEATEB
				amount = 1
			}
			
			atmosphereCurve
			{
				key = 0 310
				key = 1 250
			}
			massMult = 1.0

			TESTFLIGHT:NEEDS[TestLite|TestFlight]
			{
				testedBurnTime = 360
				ratedBurnTime = 340
				safeOverburn = false
				ignitionReliabilityStart = 0.824444
				ignitionReliabilityEnd = 0.994333
				ignitionDynPresFailMultiplier = 0.1
				cycleReliabilityStart = 0.829608
				cycleReliabilityEnd = 0.999512
				techTransfer = RD-105-2
			}

		}
	}

	RESOURCE
	{
		name = TEATEB
		amount = 1
		maxAmount = 1
	}
}
