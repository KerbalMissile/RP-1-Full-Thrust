// ============================================================================
// Add tag to parts
// ============================================================================
@PART[sspx-rp1ft-basic-greenhouse]:BEFORE[zzzKerbalism]
{
	%capsuleTier = GreenhouseAdv
}

// ============================================================================
// Advanced Plant Growth Experiment
// ============================================================================
EXPERIMENT_DEFINITION
{
	id = RP1FTPlantExperimentAdv
	title = Advanced Plant Observation
	baseValue = 300 
	scienceCap = 300
	dataScale = 25
	requireAtmosphere = False
	situationMask = 16 
	biomeMask = 0
	description = To analyze how solar radiation and zero-G conditions affect the growth of plants over a longer period of time. <b>NOTE: This experiment takes 60 Days to complete.</b> //Placeholder Text.
	mass = 0
	techRequired = spaceShuttles
	cost = 0
	tags = GreenhouseAdv
	minCrew = 2
	celestialBodies = Earth
	situations = ORBITING
	RESULTS
	{
		default = With the plants now partially grown we have seen that they are healthy and we have the knowledge to now grow plants in space to feed astronauts in the future.
	}
	KERBALISM_EXPERIMENT
	{
		// sample mass in tons. if undefined or 0, the experiment produce a file
		SampleMass = 0
		// Body restrictions, multiple lines allowed (just don't use conflicting combinations).
		BodyAllowed = HomeBody
		IncludeExperiment = 
	}
}
@PART[*]:HAS[#capsuleTier[GreenhouseAdv]]:FOR[zzzKerbalism]
{
	MODULE
	{
		name = Experiment
		experiment_id = RP1FTPlantExperimentAdv
		ec_rate = 0.2 
		data_rate = 25 
		@data_rate /= 5184000 // 60 Days
		requires = CrewMin:1
		crew_operate = True
		hide_when_unavailable = True
	}
}