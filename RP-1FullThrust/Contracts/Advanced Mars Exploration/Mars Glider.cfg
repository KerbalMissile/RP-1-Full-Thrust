CONTRACT_TYPE
{
    name = MarsGliderFT
    title = Martian Glider
    group = AdvancedMarsExplorationUM
    agent = Surveys

    description = <b>Program: Advanced Mars Exploration<br>Type: <color=red>CAPSTONE</color></b><br><br>Design and successfully launch an uncrewed glider that will fly through the atmosphere of Mars and transmit a science report.

    synopsis = Send an uncrewed glider to fly through the atmosphere of Mars

    completedMessage = Congratulations! Flying a glider through the atmosphere of another planetary body in our system is no easy feat! The science gathered from this glider will unlock some of the secrets of our Solar System.

    sortKey = 1401

    cancellable = true
    declinable = true
    autoAccept = false
    minExpiry = 0
    maxExpiry = 0
    maxCompletions = 0
    maxSimultaneous = 1
    deadline = 0

    targetBody = Mars

	// ************ REWARDS ************
    prestige = Trivial       // 1.0x
    advanceFunds = 0
    rewardScience = 0
    rewardFunds = 0
    failureFunds = 0
    rewardReputation = 600
    failureReputation = 0

    // ************ REQUIREMENTS ************

    REQUIREMENT
    {
        name = ProgramActive
        type = ProgramActive
        program = AdvancedMarsExploration
    }

    REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = MarsRoverFT
	}

    DATA
	{
		type = float
		altitudeKm = 5
	}
    
    DATA
	{
		type = float
		minSpeedsMPS = 10
	}


    // ************ PARAMETERS ************

    PARAMETER
    {
        name = VesselGroup
        type = VesselParameterGroup
        title = Uncrewed glider flight through the atmosphere of Mars
        define = MarsGlider

        PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}
        PARAMETER
        {
            name = NewVessel
            type = NewVessel
            title = Launch a new vessel
            hideChildren = true
        }
        PARAMETER
		{
			name = NoEngine
			type = PartValidation
			title = Vessel has no propulsion (no engines allowed)
			hideChildren = true
			NONE
			{
				partModule = ModuleEnginesRF
				partModule = ModuleEnginesAJEPropeller
			}
		}
        PARAMETER
		{
			name = ReachAlt
			type = ReachState
			minAltitude = 5000
			disableOnStateChange = true
			title = Reach 5 km
			hideChildren = true
		}
        PARAMETER
		{
			name = HoldSituation
			type = ReachState
			minSpeed = 10
			situation = FLYING
			
			title = Fly above 10 M/s in level flight.
			
			disableOnStateChange = true
			
			PARAMETER
			{
				name = Duration
				type = Duration
				duration = 30m
				preWaitText = Reach specified speed while gliding.
				waitingText = Testing gliding
				completionText = Glide completed, you are cleared to land or keep gliding and collect more science!
			}
		}
    }
}