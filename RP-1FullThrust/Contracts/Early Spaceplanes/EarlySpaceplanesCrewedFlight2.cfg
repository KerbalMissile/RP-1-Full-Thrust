CONTRACT_TYPE
{
	name = EarlySpaceplanesCrewedOrbit2
	group = EarlySpaceplanes

	title = Early Spaceplanes 3 Crew (Orbital)

	description = <b>Program: EarlySpaceplanes<br>Type: <color=green>Required</color></b><br><br>Design, build, and launch a crewed plane and put it into an orbit and return home safely. Optionally, landing back at the runway will award extra reputation. If playing from the Cape, the Space Shuttle runway provided by the RSS-CanaveralHD mod is also a valid landing target.
	genericDescription = Design, build and launch a 3 crewed plane to put 3 people into an orbit above 145km and return home safely.

	synopsis = Launch a crewed spaceplane to orbit.

	completedMessage = Congratulations on a successful flight!
	
	sortKey = 616

	deadline = 0
	cancellable = false
	declinable = false
	autoAccept = false
	minExpiry = 1
	maxExpiry = 1

	targetBody = HomeWorld()

	maxCompletions = 1
	maxSimultaneous = 1
	prestige = Trivial

	// ************ REWARDS ************
	prestige = Trivial       // 1.0x
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 120000
	failureFunds = 100000
	rewardReputation = 100
	failureReputation = 100 // was @rewardReputation
	
	// ************* REQUIREMENTS ****************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = EarlyOrbitalSpaceplanes
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = EarlySpaceplanesCrewedOrbit
		title = Complete the 'Crewed Early Spaceplanes Orbital Test Flight' contract.
	}

	PARAMETER
	{
		name = Early3CrewedSpaceplaneOrbit
		type = VesselParameterGroup
		title = Early 3 Crewed Spaceplane Orbit
		define = EarlySpaceplaneOrbitUncrewed
		
		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}
		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 3
			maxCrew = 3
			title = Crew Of 3
			hideChildren = true
		}
		PARAMETER
		{
			name = Orbit
			type = Orbit
			minPeA = 145000
			disableOnStateChange = true
			title = Achieve orbit around @targetBody with a minimum perigee of 145 km
			
			PARAMETER
			{
				name = Duration
				type = Duration

				duration = 1440m

				preWaitText = Keep 3 Crew In Orbit For 
				waitingText = Checking For 1 Day In Orbit With 3 Crew
				completionText = Crew In Orbit For 1 Day: Confirmed
			}
		}
	}

	PARAMETER
	{
		name = ReturnVesselGroup
		type = VesselParameterGroup
		title = Land anywhere with a descent angle lower than 10 degrees, and a suface velocity below 100 m/s.
		vessel = supersonicCraft
		hideChildren = true

		PARAMETER
		{
			name = ReturnHome
			type = RP1ReturnHome
			title = Return home safely
			maxSpeed = 5
			hideChildren = true
			completeInSequence = true
		}
		PARAMETER
		{
			name = HorizontalLanding
			type = HorizontalLanding
			descentAngle = 10
			maxSrfVel = 100
			hideChildren = true
			completeInSequence = true
		}
	}
}
