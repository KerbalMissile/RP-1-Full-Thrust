CONTRACT_TYPE
{
	name = EarlySpaceplanesRendezvous
	title = First Spaceplane Rendezvous
	group = EarlySpaceplanes
	agent = Federation Aeronautique Internationale

	tag = CrewedOrbitRequired

	description = <b>Program: Early Orbital Spaceplanes<br>Type: <color=green>Required</color></b><br><br>The first successful rendezvous between two spacecraft was when Gemini 6 and 7 met in 1965. Wally Schirra maneuvered Gemini 6 to within 30 cm of Gemini 7, close enough and precise enough to prove that docking two craft together in space was possible. Using your own knowledge of orbital mechanics, bring two spaceplanes to within 100 meters of each other while in orbit around Earth. At least one of the spacecraft must be a new launch.

	synopsis = Perform the First Rendezvous of two spaceplanes in orbit of the Earth.

	completedMessage = Congratulations! By accomplishing the first splaceplane rendezvous, it opens up the possibilities of what we can do while in orbit.

	sortKey = 105

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = HomeWorld()


	// ************ REWARDS ************
	prestige = Trivial       // 1.0x
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 150
	failureReputation = 0 // was @rewardReputation

	// ************ REQUIREMENTS ************
	
	REQUIREMENT
	{
		name = Any
		type = Any

		REQUIREMENT
		{
			name = ProgramActive
			type = ProgramActive
			program = EarlyOrbitalSpaceplanes
		}

		REQUIREMENT
		{
			name = All
			type = All

			REQUIREMENT
			{
				name = CompleteContract
				type = CompleteContract
				contractType = EarlySpaceplanesCrewedOrbit2
			}
		}
	}

	// Will be added in once optional contracts for Early Orbital Spaceplanes Exist
    
    // REQUIREMENT
	// {
	// 	name = AcceptContract
	// 	type = AcceptContract
	// 	tag = CrewedOrbitOptional // Temp Tag For Future Reference
	// 	invertRequirement = true
	// 	title = Don't have an active optional crewed orbit contract.
	// }

	PARAMETER
	{
		name = Rendezvous
		type = VesselParameterGroup
		title = First rendezvous
		define = Rendezvous

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new spaceplane
			hideChildren = true
		}
		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			minCrew = 1
			crewOnly = true
			title = Have at least 1 crewmember on board
			hideChildren = true
		}
		PARAMETER
		{
			name = Orbit
			type = Orbit
			minPeA = @targetBody.AtmosphereAltitude()
			title = Orbit @targetBody
			disableOnStateChange = true
			hideChildren = true
		}
		PARAMETER
		{
			name = Rendezvous
			type = RP1Rendezvous
			distance = 100
			relativeSpeed = 0.5
			title = Rendezvous two splaceplanes in orbit (closer than 100m, relative speed less than 0.5m/s)
			hideChildren = true
			disableOnStateChange = true
		}
		
        PARAMETER
		{
		name = ReturnVesselGroup
		type = VesselParameterGroup
		title = Land anywhere with a descent angle lower than 10 degrees, and a suface velocity below 100 m/s.
		vessel = supersonicCraft
		hideChildren = true

			PARAMETER
			{
				name = ReturnHome
				type = RP1ReturnHome
				title = Return home safely
				maxSpeed = 5
				hideChildren = true
				completeInSequence = true
			}
			PARAMETER
			{
				name = HorizontalLanding
				type = HorizontalLanding
				descentAngle = 10
				maxSrfVel = 100
				hideChildren = true
				completeInSequence = true
			}
		}
    }   
}