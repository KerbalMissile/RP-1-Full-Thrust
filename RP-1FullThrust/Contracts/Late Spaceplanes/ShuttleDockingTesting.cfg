CONTRACT_TYPE
{
	name = ShuttleDockingTesting
	group = LateEarthSpacePlanes

	title = First Spaceplane Docking

	description = <b>Program: Late Earth Orbital Spaceplanes<br>Type: <color=green>Required</color></b><br><br>Design, build, and Launch a large crewed space plane and put it into an orbit with a minimum PE of 250km and stay there for a week with a minimum of 3 crew, dock with another spacecraft, then return home safely. You will need to land back at the runway for the contract to be completed. If playing from the Cape, the Space Shuttle runway provided by the RSS-CanaveralHD mod is also a valid landing target. <b><br>Type: <color=green>Docking Mission</color></b><br><br>
	genericDescription = Design, build and launch a crewed plane to put people into an orbit above 250km, dock, and return home safely.

	synopsis = Launch a crewed spaceplane to orbit to perform docking with another spacecraft.

	completedMessage = Congratulations on a successful docking flight!
	
	sortKey = 619

	deadline = 0
	cancellable = false
	declinable = false
	autoAccept = false
	minExpiry = 1
	maxExpiry = 1

	targetBody = HomeWorld()

	maxCompletions = 1
	maxSimultaneous = 1
	prestige = Trivial

	// ************ REWARDS ************
	prestige = Trivial       // 1.0x
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 450
	failureReputation = 600 // was @rewardReputation
	
	// ************* REQUIREMENTS ****************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = LateEarthSpacePlanes
	}

    REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = FirstHeavySpaceplaneLaunch
		title = Complete 'First Heavy Spaceplane Launch (Crewed)' contract
	}

    PARAMETER
	{
		name = Rendezvous
		type = VesselParameterGroup
		title = OPTIONAL: Rendezvous with a craft already in orbit
		define = Rendezvous
		optional = true
		rewardReputation = Round(@/rewardReputation * 0.3 + 0.4999, 1)

		PARAMETER
		{
			name = Orbit
			type = Orbit
			minPeA = @targetBody.AtmosphereAltitude()
			title = Orbit @targetBody
			disableOnStateChange = true
			hideChildren = true
		}
		PARAMETER
		{
			name = Rendezvous
			type = RP1Rendezvous
			distance = 100
			relativeSpeed = 0.5
			title = Rendezvous two craft in orbit (closer than 100m, relative speed less than 0.5m/s)
			hideChildren = true
			disableOnStateChange = true
		}
	}
    
	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = Dock to another spacecraft while in orbit.
		define = dockingSpacecraft

        PARAMETER
		{
			name = SpaceplaneMass
			type = VesselMass
			minMass = 40
			title = Spaceplane Must Be 40 Tons
			disableOnStateChange = false
		}
		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}
		PARAMETER
		{
			name = Orbit
			type = Orbit
			minPeA = @targetBody.AtmosphereAltitude()
			title = Orbit @targetBody
			disableOnStateChange = true
			hideChildren = true
		}
		PARAMETER
		{
			name = Docking
			type = Docking
			title = Dock two spacecraft in orbit
			hideChildren = true
			completeInSequence = true
		}
        PARAMETER
		{
			name = ThreeCrew
			type = HasCrew
			minCrew = 3
			title = Have 3 Crew Members on board
			hideChildren = true
			disableOnStateChange = true    // Probably to prevent the timers from getting reset when EVAing a naut
		}	
		PARAMETER
		{
			name = Orbit
			type = Orbit
			minPeA = 250000
			maxApA = 600000   // Inner van allen belt
			disableOnStateChange = true
			title = Achieve orbit around @targetBody with a minimum perigee of 250 km
		}
	}

	PARAMETER
	{
		name = ReturnVesselGroup
		type = VesselParameterGroup
		title = Land back at the runway with a descent angle lower than 10 degrees, and a suface velocity below 120 m/s.
		vessel = crewedOrbitalCraft
		hideChildren = true

		PARAMETER
		{
			name = ReturnHome
			type = RP1ReturnHome
            title = Return Home Safely
			landAtFacility = Runway
			maxSpeed = 5
			hideChildren = true
			completeInSequence = true
		}
		PARAMETER
		{
			name = HorizontalLanding
			type = HorizontalLanding
			descentAngle = 10
			maxSrfVel = 120
			hideChildren = true
			completeInSequence = true
		}
	}
}
