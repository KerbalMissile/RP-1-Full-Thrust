CONTRACT_TYPE
{
	name = ShuttlePlantExperiment
	group = LateEarthSpacePlanes

	title = Spaceplane Plant Experiment Observation

	description = <b>Program: Late Earth Orbital Spaceplanes<br>Type: <color=green>Required</color></b><br><br>Design, build, and launch a large crewed space plane and put it into an orbit with a minimum PE of 250km and stay there for two weeks with a minimum of 3 crew, observe plant growth, and return home safely. You will need to land back at the runway for the contract to be completed. If playing from the Cape, the Space Shuttle runway provided by the RSS-CanaveralHD mod is also a valid landing target. <b><br>Type: <color=green>Plant Observation Experiment Required</color></b><br><br>
	genericDescription = Design, build and launch a crewed plane to put people with plants into an orbit above 250km, perform the Plant Observation experiment, and return home safely.

	synopsis = Launch a crewed spaceplane to orbit to perform the Plant Experiment for two weeks.

	completedMessage = Congratulations on a successful flight!
	
	sortKey = 617

	deadline = 0
	cancellable = false
	declinable = false
	autoAccept = false
	minExpiry = 1
	maxExpiry = 1

	targetBody = HomeWorld()

	maxCompletions = 1
	maxSimultaneous = 1
	prestige = Trivial

	// ************ REWARDS ************
	prestige = Trivial       // 1.0x
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 450
	failureReputation = 600 // was @rewardReputation
	
	// ************* REQUIREMENTS ****************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = LateEarthSpacePlanes
	}

    REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = FirstHeavySpaceplaneLaunch
		title = Complete 'Heavy Spaceplane Launch (Crewed)' contract
	}
	
    PARAMETER
	{
		name = Plant Growth In Zero-G
		type = RP1CollectScience
		optional = false
		rewardReputation = 10
		targetBody = HomeWorld()
		situation = InSpaceLow
		experiment = RP1FTPlantExperimentAdv
		fractionComplete = 0.25
	}

	PARAMETER
	{
		name = LateCrewedSpaceplaneOrbit
		type = VesselParameterGroup
		title = Late Crewed Spaceplane Two Week Long Orbit
		define = LateSpaceplaneOrbitCrewed
		
		PARAMETER
		{
			name = SpaceplaneMass
			type = VesselMass
			minMass = 40
			title = Spaceplane Must Be 40 Tons
			disableOnStateChange = false
		}
		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}
		PARAMETER
		{
			name = ThreeCrew
			type = HasCrew
			minCrew = 3
			title = Have 3 Crew Members on board
			hideChildren = true
			disableOnStateChange = true    // Probably to prevent the timers from getting reset when EVAing a naut
		}
		PARAMETER
		{
			name = Orbit
			type = Orbit
			minPeA = 250000
			maxApA = 600000   // Inner van allen belt
			disableOnStateChange = true
			title = Achieve orbit around @targetBody with a minimum perigee of 250 km
			
			PARAMETER
			{
				name = Duration
				type = Duration

				duration = 15d

				preWaitText = Check for stable orbit
				waitingText = Checking for stable orbit
				completionText = Stable orbit: Confirmed
			}
		}
	}

	PARAMETER
	{
		name = ReturnVesselGroup
		type = VesselParameterGroup
		title = Land back at the runway with a descent angle lower than 10 degrees, and a suface velocity below 120 m/s.
		vessel = crewedOrbitalCraft
		hideChildren = true

		PARAMETER
		{
			name = ReturnHome
			type = RP1ReturnHome
            title = Return Home Safely
			landAtFacility = Runway
			maxSpeed = 5
			hideChildren = true
			completeInSequence = true
		}
		PARAMETER
		{
			name = HorizontalLanding
			type = HorizontalLanding
			descentAngle = 10
			maxSrfVel = 120
			hideChildren = true
			completeInSequence = true
		}
	}
}