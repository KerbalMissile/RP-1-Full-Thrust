CONTRACT_TYPE
{
	name = WeekLongShuttleOrbit
	group = LateEarthSpacePlanes

	title = Long Term Orbital Spaceplane Test

	description = <b>Program: Late Earth Orbital Spaceplanes<br>Type: <color=green>Required</color></b><br><br>Design, build, and launch a larger crewed space plane and put it into an orbit with a minimum PE of 150km and stay there for a week with a minimum of 3 crew, and return home safely. You will need to land back at the runway for the contract to be completed. If playing from the Cape, the Space Shuttle runway provided by the RSS-CanaveralHD mod is also a valid landing target.
	genericDescription = Design, build and launch a crewed plane to put a person into an orbit above 150km and return home safely.

	synopsis = Launch a crewed spaceplane to orbit for a week.

	completedMessage = Congratulations on a successful flight!
	
	sortKey = 616

	deadline = 0
	cancellable = false
	declinable = false
	autoAccept = false
	minExpiry = 1
	maxExpiry = 1

	targetBody = HomeWorld()

	maxCompletions = 1
	maxSimultaneous = 1
	prestige = Trivial

	// ************ REWARDS ************
	prestige = Trivial       // 1.0x
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 120000
	failureFunds = 100000
	rewardReputation = 100
	failureReputation = 100 // was @rewardReputation
	
	// ************* REQUIREMENTS ****************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = LateEarthSpacePlanes
	}

	PARAMETER
	{
		name = LateCrewedSpaceplaneOrbit
		type = VesselParameterGroup
		title = Late Crewed Spaceplane Week Long Orbit
		define = LateSpaceplaneOrbitCrewed
		
		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}
		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 3
			maxCrew = 7
			title = Crewed
			hideChildren = true
		}
		PARAMETER
		{
			name = Orbit
			type = Orbit
			minPeA = 150000
			disableOnStateChange = true
			title = Achieve orbit around @targetBody with a minimum perigee of 150 km
			
			PARAMETER
			{
				name = Duration
				type = Duration

				duration = 7d

				preWaitText = Check for stable orbit
				waitingText = Checking for stable orbit
				completionText = Stable orbit: Confirmed
			}
		}
	}

	PARAMETER
	{
		name = ReturnVesselGroup
		type = VesselParameterGroup
		title = Land back at the runway with a descent angle lower than 10 degrees, and a suface velocity below 100 m/s.
		vessel = crewedOrbitalCraft
		hideChildren = true

		PARAMETER
		{
			name = ReturnHome
			type = RP1ReturnHome
            title = Return Home Safely
			landAtFacility = Runway
			maxSpeed = 5
			hideChildren = true
			completeInSequence = true
		}
		PARAMETER
		{
			name = HorizontalLanding
			type = HorizontalLanding
			descentAngle = 10
			maxSrfVel = 100
			hideChildren = true
			completeInSequence = true
		}
	}
}
