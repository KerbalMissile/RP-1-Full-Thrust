// ============================================================================
// Add tag to parts
// ============================================================================
@PART[*]:HAS[#TechRequired[spaceShuttles],#CrewCapacity[>0]]:BEFORE[zzzKerbalism]
{
	%capsuleTier = Shuttles
}
@PART[*]:HAS[#TechRequired[improvedSpaceplanes],#CrewCapacity[>5]]:BEFORE[zzzKerbalism]
{
	%capsuleTier = Shuttles
}

// ============================================================================
// Plant Growth Experiment
// ============================================================================
EXPERIMENT_DEFINITION
{
	id = RP1FTPlantExperiment
	title = Plant Observation
	baseValue = 150 
	scienceCap = 150
	dataScale = 25
	requireAtmosphere = False
	situationMask = 16 
	biomeMask = 0
	description = To analyze how solar radiation and zero-G conditions affect the growth of plants. <b>NOTE: This experiment takes One Month to complete.</b> //Placeholder Text.
	mass = 0
	techRequired = spaceShuttles
	cost = 0
	tags = spaceShuttles
	minCrew = 2
	celestialBodies = Earth
	situations = ORBITING
	RESULTS
	{
		default = With the plants now partially grown we have seen that they are healthy and we have the knowledge to now grow plants in space to feed astronauts in the future.
	}
	KERBALISM_EXPERIMENT
	{
		// sample mass in tons. if undefined or 0, the experiment produce a file
		SampleMass = 0
		// Body restrictions, multiple lines allowed (just don't use conflicting combinations).
		BodyAllowed = HomeBody
		IncludeExperiment = 
	}
}
@PART[*]:HAS[#capsuleTier[Shuttles]]:FOR[zzzKerbalism]
{
	MODULE
	{
		name = Experiment
		experiment_id = RP1FTPlantExperiment
		ec_rate = 0.1 
		data_rate = 25 
		@data_rate /= 2592000 // 30 Days
		requires = CrewMin:2
		crew_operate = True
		hide_when_unavailable = True
	}
}