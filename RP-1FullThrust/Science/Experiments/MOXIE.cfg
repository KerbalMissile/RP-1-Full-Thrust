// ============================================================================
// MOXIE
// ============================================================================
EXPERIMENT_DEFINITION
{
	id = moxieexperiment
	title = M.O.X.I.E. Experiment
	baseValue = 32.5
	scienceCap = 32.5
	dataScale = 10
	requireAtmosphere = True
	situationMask = 56
	biomeMask = 0	
	
	RESULTS
	{
		default = Using the M.O.X.I.E. instrument, we have successfully extracted oxygen from the Martian atmosphere. This technology demonstration paves the way for future human missions to Mars by providing a sustainable source of oxygen for breathing and for use in rocket propellant.
	}
	KERBALISM_EXPERIMENT
	{
		// sample mass in tons. if undefined or 0, the experiment produce a file
		SampleMass = 0.0002
		// Body restrictions, multiple lines allowed (just don't use conflicting combinations).
		BodyAllowed = 
		IncludeExperiment = 
	}
}
// ============================================================================
// Add MOXIE to its part
// ============================================================================
@PART[moxie]:FINAL
{
	MODULE
	{
		name = Experiment
		experiment_id = moxieexperiment
		ec_rate = 1.0 
		data_rate = 25 
		@data_rate /= 864000 // 10 Days
		requires = 
		hide_when_unavailable = True
	}
}